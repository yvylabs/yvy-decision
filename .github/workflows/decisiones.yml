name: decisiones
on:
  push:
    branches: [master]
    paths-ignore:
      - 'web/decisiones.json'
      - 'web/grafo.json'
  workflow_dispatch:

jobs:
  decidir:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements-decisiones.txt
      - name: Generar decisiones
        run: python runner/decisiones.py
      - name: Publicar artefactos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/decisiones.json web/grafo.json
          git diff --cached --quiet || git commit -m "chore(decisiones): regenerar decisiones y grafo"
          git push
