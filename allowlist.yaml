    campo_fecha_corte: fecha_publicacion
    campo_unidad: pesos
    max_resultados: 5
    cache_horas: 720
    requiere_login: false
    alcance_territorial: nacional
    jurisdiccion: nacional
    relacion: regula
    estado: activo
    nota: NO hardcodear arca.gob.ar. Nunca CUIT/clave fiscal.

