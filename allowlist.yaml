    campo_fecha_corte: fecha
    campo_unidad: unidad
    max_resultados: 5
    cache_horas: 12
    alcance_territorial: nacional
    jurisdiccion: nacional
    relacion: describe
    estado: activo

  - id: presupuesto_abierto
