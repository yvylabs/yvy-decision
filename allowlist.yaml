# Yvy Decisión — allowlist de fuentes oficiales
# Regla de oro: NUNCA usar la home como `base`. Solo API / geoservicio / dataset.
# Cualquier fuente fuera de esta lista NO existe para el motor.
# Verificado: 2026-11-18. Dominios .gob.ar / .gov.ar NO se normalizan.

version: 1
verificado_el: "2026-11-18"

# ---------------------------------------------------------------------------
# CAPA MADRE — descubrimiento
# ---------------------------------------------------------------------------
fuentes:
  - id: datos_gob_ar
    tipo: ckan
    base: https://datos.gob.ar/api/3/action
    modos: [package_search, package_show, resource_search, datastore_search]
    organismos_permitidos: [INDEC, IGN, Ministerio de Educacion, SMN, Ministerio de Economia]
    temas_permitidos: [poblacion, educacion, catastro, mineria, clima, presupuesto]
    formatos: [csv, xlsx, json, geojson, pdf]
    campo_fecha_corte: result.metadata_modified
    campo_unidad: result.notes
    campo_licencia: result.license_title
    max_resultados: 5
    cache_horas: 24
    pdf_escaneado: false
    alcance_territorial: nacional
    jurisdiccion: nacional
    relacion: describe
    estado: activo

  - id: argentina_gob_ar
    tipo: rest
    base: https://www.argentina.gob.ar
    modos: [busqueda_tramites, ficha_organismo]
    organismos_permitidos: [APN]
    temas_permitidos: [tramites, organismos, normativa_vigente]
    formatos: [html, pdf]
    campo_fecha_corte: fecha_actualizacion
    campo_unidad: no_aplica
    max_resultados: 5
    cache_horas: 720
    alcance_territorial: nacional
    jurisdiccion: nacional
    relacion: regula
    estado: activo
    nota: solo validar organismo/tramite vigente, nunca dato numerico

  - id: idera
    tipo: ckan
    base: https://www.idera.gob.ar
    modos: [busqueda_catalogo, geoservicios]
    organismos_permitidos: [IGN, CONAE, INTA, provincias]
    temas_permitidos: [catastro, geodesia, ambiente, ordenamiento_territorial, mineria]
    formatos: [geojson, wms, wfs]
    campo_fecha_corte: metadata.modified
    campo_unidad: metadato
    max_resultados: 5
    cache_horas: 168
    alcance_territorial: nacional
    jurisdiccion: nacional
    relacion: describe
    estado: activo

  # ---------------------------------------------------------------------------
  # ECONOMIA / ESTADISTICA
  # ---------------------------------------------------------------------------
  - id: indec_series
    tipo: rest
