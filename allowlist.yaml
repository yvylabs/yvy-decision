    campo_unidad: pesos
    max_resultados: 5
    cache_horas: 24
    requiere_login: false
    alcance_territorial: nacional
    jurisdiccion: nacional
    relacion: regula
    estado: activo

  - id: boletin_oficial
    tipo: listado_pdf
    base: https://www.boletinoficial.gob.ar
    modos: [busqueda_avanzada, edicion_dia]
