<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yvy Decisión</title>
<style>
:root{--paper:#FAFAFA;--sheet:#fff;--line:#EAEAEA;--ink:#1A1A1A;--mute:#5A5A5A;--green:#0F5132;--sage:#F4F9F5;--warn:#B7791F}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px Inter,system-ui,sans-serif;padding:40px 20px;display:flex;justify-content:center}
main{width:min(940px,100%)}header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:center}
h1{font:600 32px Georgia,serif;margin:0}.tag{font:600 11px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--sheet);border:1px solid var(--line);padding:24px;margin-bottom:16px}
.q{font:500 19px Georgia,serif;margin:0 0 14px}
.status{display:inline-block;padding:6px 10px;border-radius:3px;font:600 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.ok{background:var(--sage);color:var(--green)}.abstain{background:#FFF6E6;color:var(--warn)}.forced{background:#EEF2FF;color:#3730A3}
.meta{font:11px ui-monospace,monospace;color:var(--mute);margin:12px 0}.rec{background:var(--sage);border-left:3px solid var(--green);padding:12px;margin-top:12px;font-size:13px}
.faltan{font-size:13px;color:var(--mute);margin-top:10px}.badge{display:inline-block;border:1px solid var(--line);padding:3px 7px;border-radius:3px;font:10px ui-monospace,monospace;color:var(--green);margin-right:5px}
</style>
</head>
<body><main>
<header><div><h1>Yvy Decisión</h1><span class="tag">Cerrillos · Salta</span></div><span class="tag" id="hash">—</span></header>
<div id="out">cargando decisiones…</div>
</main>
<script>
fetch('decisiones.json').then(r=>r.json()).then(d=>{
  document.getElementById('hash').textContent = d.hash ? d.hash.slice(0,12)+'…' : 'sin hash';
  const out = document.getElementById('out'); out.innerHTML='';
  for(const x of d.decisiones||[]){
    const c=document.createElement('article'); c.className='card';
    c.innerHTML=`<p class="q">${x.pregunta||x.pregunta_id}</p>
      <span class="status ${x.status}">${x.status}${x.puede_decidir?' · decide':' · no decide'}</span>
      <div class="meta">${(x.fuentes_usadas||[]).map(f=>`<span class="badge">Fuente: ${f}</span>`).join('')}
      ${(x.faltan||[]).map(f=>`<span class="badge">Falta: ${f.hecho}</span>`).join('')}</div>
      ${x.motivo?`<div class="meta">motivo: ${x.motivo}</div>`:''}
      ${(x.recomendacion&&x.recomendacion.texto)?`<div class="rec">${x.recomendacion.texto}</div>`:''}
      <div class="faltan">${x.status==='abstain'?(x.accion_no||''):(x.accion_si||'')}</div>`;
    out.appendChild(c);
  }
}).catch(e=>{document.getElementById('out').textContent='No hay decisiones generadas todavía. Corré el runner.'});
</script>
</body></html>
