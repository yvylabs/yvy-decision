<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yvy Decisión</title>
<style>
:root{--paper:#FAFAFA;--sheet:#fff;--line:#EAEAEA;--ink:#1A1A1A;--mute:#5A5A5A;--green:#0F5132;--sage:#F4F9F5;--warn:#B7791F;--red:#B42318}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px Inter,system-ui,sans-serif;padding:40px 20px;display:flex;justify-content:center}
main{width:min(940px,100%)}header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:16px}
h1{font:600 32px Georgia,serif;margin:0}.tag{font:600 11px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.buscar{display:flex;gap:8px;margin-bottom:18px}.buscar input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:4px;font:14px Inter,sans-serif}
.buscar button{padding:10px 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;cursor:pointer;font:500 13px Inter,sans-serif}
.procesando{font:12px ui-monospace,monospace;color:var(--green);margin-bottom:14px;min-height:16px}
.card{background:var(--sheet);border:1px solid var(--line);padding:22px;margin-bottom:14px}
.q{font:500 19px Georgia,serif;margin:0 0 12px}
.status{display:inline-block;padding:6px 10px;border-radius:3px;font:600 11px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.ok{background:var(--sage);color:var(--green)}.abstain{background:#FFF6E6;color:var(--warn)}.forced{background:#EEF2FF;color:#3730A3}
.meta{font:11px ui-monospace,monospace;color:var(--mute);margin:11px 0;line-height:1.7}
.badge{display:inline-block;border:1px solid var(--line);padding:3px 7px;border-radius:3px;font:10px ui-monospace,monospace;color:var(--green);margin-right:5px}
.badge.bad{color:var(--red);border-color:#F2C6C0}.rec{background:var(--sage);border-left:3px solid var(--green);padding:12px;margin-top:12px;font-size:13px;white-space:pre-line}
details{margin-top:12px;font-size:13px}summary{cursor:pointer;color:var(--green)}details pre{font:11px ui-monospace,monospace;background:#F8F8F8;padding:10px;overflow:auto}
</style>
</head>
<body><main>
<header><div><h1>Yvy Decisión</h1><span class="tag">Cerrillos · Salta</span></div><span class="tag" id="hash">—</span></header>

<div class="buscar">
  <input id="q" placeholder="Buscar en fuentes oficiales (ej: educación, catastro, minería)">
  <button id="btn">Consultar en vivo</button>
</div>
<div class="procesando" id="estado">Listo. Las decisiones se verifican contra los sitios oficiales del allowlist.</div>
<div id="out">cargando decisiones…</div>

<script>
let grafo = {nodos:[],aristas:[]};
const out = document.getElementById('out');
const estado = document.getElementById('estado');

function badge(texto, bad){ return `<span class="badge${bad?' bad':''}">${texto}</span>`; }

function pintar(d){
  document.getElementById('hash').textContent = d.hash ? d.hash.slice(0,12)+'…' : (d.linaje?.hash_estatico||'').slice(0,12)+'…';
  out.innerHTML='';
  for(const x of d.decisiones||[]){
    const c=document.createElement('article'); c.className='card';
    const caidas = x.sitios_no_disponibles||[];
    const rec = x.recomendacion_viva||x.recomendacion||{};
    const vivas = x.fuentes_vivas||[];
    c.innerHTML=`<p class="q">${x.pregunta||x.pregunta_id}</p>
      <span class="status ${x.status}">${x.status}${x.puede_decidir?' · decide':' · no decide'}</span>
      <div class="meta">
        ${vivas.map(v=>badge(v.estado==='no_disponible'?'Sitio no disponible':v.estado+': '+v.id, v.estado==='no_disponible')).join('')}
        ${(x.faltan||[]).map(f=>badge('Falta: '+f.hecho,true)).join('')}
      </div>
      ${caidas.length?`<div class="rec">Sitio web oficial NO DISPONIBLE: ${caidas.join(', ')}. No es falta de dato: no pudimos verificar la fuente.</div>`:''}
      ${rec.texto?`<div class="rec">${rec.texto}</div>`:''}
      ${x.motivo?`<div class="meta">motivo: ${x.motivo}</div>`:''}
      <div class="meta">${x.status==='abstain'?(x.accion_no||''):(x.accion_si||'')}</div>
      <details><summary>Ver linaje (${grafo.nodos.length} nodos)</summary><pre>${JSON.stringify({nodos:grafo.nodos,aristas:grafo.aristas},null,2)}</pre></details>`;
    out.appendChild(c);
  }
}

async function cargar(q=''){
  estado.textContent='Procesando: consultando sitios oficiales del allowlist…';
  try{
    const [dec, g] = await Promise.all([
      fetch('/api/decisiones'+(q?'?q='+encodeURIComponent(q):'')).then(r=>r.ok?r.json():null),
      fetch('/api/grafo').then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    let payload = dec;
    if(!payload) payload = await fetch('decisiones.json').then(r=>r.json());
    if(g) grafo=g; else grafo=await fetch('grafo.json').then(r=>r.json()).catch(()=>({nodos:[],aristas:[]}));
    pintar(payload);
    estado.textContent = dec ? 'Consulta en vivo completada.' : 'Modo estático (Worker no disponible).';
  }catch(e){
    estado.textContent='No se pudo consultar: '+e.message;
  }
}

document.getElementById('btn').onclick=()=>cargar(document.getElementById('q').value.trim());
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')cargar(e.target.value.trim())});
cargar();
</script>
</body></html>
